name: Barangay System CI

on:
  push:
    branches: [ "main" ]

jobs:
  test-build:
    runs-on: ubuntu-latest

    # GLOBAL ENV: Para safe ang lahat ng steps (pati key:generate)
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: barangay_testing
      DB_USERNAME: root
      DB_PASSWORD: password
      BROADCAST_CONNECTION: log
      BROADCAST_DRIVER: log
      CACHE_DRIVER: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      PUSHER_APP_ID: 12345
      PUSHER_APP_KEY: fake_key
      PUSHER_APP_SECRET: fake_secret

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: barangay_testing
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: pdo_mysql, bcmath, intl, gd, zip
        coverage: none

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Install Composer dependencies
      run: composer install --prefer-dist --no-ansi --no-interaction --no-progress --no-scripts

    - name: Install NPM & Build
      run: |
        npm ci
        npm run build

    - name: Prepare Application
      run: |
        cp .env.example .env
        php artisan key:generate
        chmod -R 777 storage bootstrap/cache

    - name: Execute Tests
      run: |
        php artisan migrate --force
        php artisan test
